apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bizion-backend-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: bizion-backend
  namespaceSelector:
    matchNames:
      - bizion
  endpoints:
  - port: "3000"
    path: /api/v1/health
    interval: 15s
