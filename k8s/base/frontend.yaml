apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizion-frontend
  namespace: bizion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bizion-frontend
  template:
    metadata:
      labels:
        app: bizion-frontend
    spec:
      containers:
      - name: frontend
        image: bizion-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        envFrom:
        - configMapRef:
            name: bizion-config
        readinessProbe:
          tcpSocket:
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bizion-frontend
  namespace: bizion
spec:
  ports:
  - port: 5173
    targetPort: 5173
  selector:
    app: bizion-frontend
