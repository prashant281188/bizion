apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizion-ingress
  namespace: bizion
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizion-backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizion-frontend
            port:
              number: 5173
